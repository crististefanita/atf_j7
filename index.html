<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play chess against AI, solve puzzles, and study openings.">
  <title>Chess Lab</title>
  <link rel="stylesheet" href="runtime/1d252b7ada67238062c5f7370d1012ffd342e38d04cb40d1f9d8714c617b512d/game-review.css">
  <link rel="stylesheet" href="runtime/1d252b7ada67238062c5f7370d1012ffd342e38d04cb40d1f9d8714c617b512d/study-openings.css">
  <link rel="stylesheet" href="runtime/1d252b7ada67238062c5f7370d1012ffd342e38d04cb40d1f9d8714c617b512d/study-analysis.css">
  <link rel="stylesheet" href="runtime/1d252b7ada67238062c5f7370d1012ffd342e38d04cb40d1f9d8714c617b512d/study-quests.css">
  <link rel="stylesheet" href="runtime/1d252b7ada67238062c5f7370d1012ffd342e38d04cb40d1f9d8714c617b512d/chess-controls.css">
  <link rel="stylesheet" href="runtime/1d252b7ada67238062c5f7370d1012ffd342e38d04cb40d1f9d8714c617b512d/board-layout.css">
  <script type="module" src="runtime/1d252b7ada67238062c5f7370d1012ffd342e38d04cb40d1f9d8714c617b512d/game-review.mjs"></script>
</head>
<body>
  <main>
    <header data-chess-header>
      <button id="return-menu" data-chess-back type="button" hidden>‹</button>
      <button id="archive-review-back" data-chess-back type="button" hidden>‹</button>
      <button id="review-close" data-chess-back type="button" hidden>‹</button>
      <button id="close-why" class="review-icon" type="button" aria-label="Close explanation" aria-describedby="review-why-context" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
      <h1 id="title">Chess Lab</h1>
      <div class="header-actions">
        <label id="match-automatic-option" class="match-automatic" hidden>
          <input id="match-automatic" type="checkbox"><span id="match-automatic-label">Let AI play its moves</span>
        </label>
        <button id="why-actions" class="review-icon" type="button" aria-label="Review actions" aria-expanded="false" aria-controls="review-menu" hidden><svg class="dots" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      </div>
      <div id="match-options-anchor" class="options-anchor" hidden>
        <button id="match-options-button" class="match-options-button review-icon" type="button" aria-label="Game options" aria-controls="match-options" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div id="match-options" class="options-panel" role="group" aria-label="Game options" hidden>
          <button id="flip-match" type="button">Flip board</button>
          <button id="open-review" type="button">Main menu</button>
          <button id="menu-saved" type="button">Saved games</button>
          <button id="menu-analysis" type="button">Analysis board</button>
          <button id="menu-review" type="button" hidden>Game review</button>
          <button id="menu-draw" type="button" hidden>Offer draw</button>
          <button id="menu-resign" type="button" hidden>Resign game</button>
        </div>
      </div>
    </header>
    <div id="home-menu" class="home-menu" hidden>
      <section aria-labelledby="home-games-heading">
        <h2 id="home-games-heading">Games</h2>
        <div class="home-group" id="home-games">
          <button id="open-ai" type="button" class="home-primary">New game vs computer</button>
          <button id="open-saved" type="button" hidden>Saved games</button>
          <button id="open-finished" type="button">Finished games</button>
        </div>
      </section>
      <section aria-labelledby="home-study-heading">
        <h2 id="home-study-heading">Study</h2>
        <div class="home-group" id="home-study">
          <button id="home-puzzles" type="button">Puzzles</button>
          <p id="home-study-totals" class="study-totals" hidden></p>
          <button id="home-openings" type="button">Openings</button>
          <button id="home-analysis" type="button">Analysis board</button>
        </div>
      </section>
      <section aria-labelledby="home-profile-heading">
        <h2 id="home-profile-heading">Profile</h2>
        <div class="home-group home-profile" id="home-profile">
          <button id="home-name" type="button">Name</button>
          <button id="home-settings" type="button">Settings</button>
        </div>
      </section>
    </div>
    <section id="review-tools" class="review-import-tools" hidden>
      <div class="archive" id="review-import">
        <label for="archive" id="archive-label">Open a review</label>
        <input id="archive" class="visually-hidden" type="file" accept=".json,application/json">
      </div>
      <button id="reopen-review" type="button" hidden>Resume last review</button>
    </section>
    <section id="study-quests" class="study-surface" hidden></section>
    <section id="study-openings" class="study-surface" hidden></section>
    <section id="study-analysis" class="study-surface" hidden></section>
    <div id="study-review-progress" class="analysis-progress study-surface" hidden>
      <label for="study-progress" id="study-progress-label"></label>
      <progress id="study-progress"></progress>
      <button id="cancel-study-analysis" type="button"></button>
    </div>
    <section id="match-list" class="match-list" hidden>
      <p id="empty-list"></p>
      <ul id="match-rows"></ul>
      <div id="add-matches" class="setup-actions">
        <button id="new-local" type="button">New local game</button>
        <button id="new-ai" type="button">New AI game</button>
      </div>
    </section>
    <form id="ai-setup" class="panel ai-setup" hidden>
      <div class="setup-fields">
        <label><span id="side-label">Your color</span>
          <select id="ai-side">
            <option id="white-choice" value="WHITE">White</option>
            <option id="black-choice" value="BLACK">Black</option>
            <option id="random-choice" value="RANDOM">Random</option>
          </select>
        </label>
        <label><span id="level-label">AI level</span>
          <select id="ai-level">
            <option value="BASIC">Basic</option>
            <option value="ADVANCED">Advanced</option>
            <option value="HARD">Hard</option>
          </select>
        </label>
      </div>
      <label class="ai-analysis-option">
        <input id="ai-analysis" type="checkbox" aria-labelledby="ai-analysis-label" aria-describedby="ai-analysis-help">
        <span><span id="ai-analysis-label">AI analysis for a new game</span>
          <small id="ai-analysis-help">Evaluation bar and hints during the game</small></span>
      </label>
      <div class="setup-actions">
        <button id="start-ai" type="submit">Start game</button>
        <button id="cancel-setup" type="button" hidden>Cancel</button>
      </div>
    </form>
    <section id="match" class="match" aria-busy="false" hidden>
      <div class="match-board-frame">
        <div id="match-inline-meter" class="match-inline-meter chess-evaluation-meter" role="meter" aria-label="Evaluation for White" aria-valuemin="0" aria-valuemax="100" hidden><span></span></div>
        <div id="match-board" class="board match-board study-board" role="group"></div>
      </div>
      <div class="match-caption">
        <p id="match-turn" class="turn" aria-live="polite"></p>
        <p id="match-profile" class="turn" hidden></p>
      </div>
      <div id="match-inline-analysis" class="match-inline-analysis" hidden>
        <output id="match-inline-score" aria-live="polite"></output>
        <button id="match-inline-replay" type="button" aria-haspopup="dialog" hidden></button>
        <output id="match-inline-announcement" class="visually-hidden" aria-atomic="true"></output>
      </div>
      <nav id="match-history" class="movement" data-chess-navigation aria-label="Game history" hidden>
        <button id="match-previous" data-chess-arrow type="button" aria-label="Previous move">‹</button>
        <output id="match-ply" aria-live="polite" aria-atomic="true" dir="ltr"></output>
        <button id="match-next" data-chess-arrow type="button" aria-label="Next move">›</button>
        <button id="match-inline-hint" class="review-icon" type="button" aria-label="Show AI line" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 4h4M8 14a6 6 0 1 1 8 0c-.7.5-1 1-1 2H9c0-1-.3-1.5-1-2Z"/></svg>
        </button>
      </nav>
      <div id="promotion" class="movement" hidden>
        <label for="promote" id="promote-label">Promote to</label>
        <select id="promote"></select>
      </div>
      <div class="movement match-actions">
        <button id="continue-match" type="button" hidden>Continue from here</button>
        <button id="retry-bot" type="button" hidden>Retry AI move</button>
        <button id="open-match-analysis" type="button">Analysis board</button>
        <button id="analyze" type="button">Analyze game</button>
        <button id="cancel-analysis" type="button" hidden>Cancel analysis</button>
      </div>
      <div id="analysis-progress" class="analysis-progress" hidden>
        <label for="progress" id="progress-label">Analyzing game</label>
        <progress id="progress"></progress>
      </div>
    </section>
    <dialog id="match-inline-preview" aria-labelledby="match-inline-preview-title">
      <header data-chess-header>
        <button id="match-inline-close" data-chess-back class="review-icon" type="button" aria-label="Return to the position" autofocus>‹</button>
        <h2 id="match-inline-preview-title">Calculated line</h2>
      </header>
      <div id="match-inline-preview-board"></div>
      <div class="match-inline-preview-navigation" data-chess-navigation>
        <button id="match-inline-previous" data-chess-arrow type="button" aria-label="Previous move">‹</button>
        <output id="match-inline-position" aria-live="polite"></output>
        <button id="match-inline-next" data-chess-arrow type="button" aria-label="Next move">›</button>
      </div>
      <div class="match-inline-preview-details">
        <div id="match-inline-branches" class="analysis-study-variants" data-chess-lines></div>
        <p id="match-inline-evidence" class="analysis-study-evidence"></p>
      </div>
    </dialog>
    <dialog id="match-resign" aria-labelledby="resign-title" aria-describedby="resign-message">
      <h2 id="resign-title">Resign game</h2>
      <p id="resign-message">End this game and record a loss?</p>
      <form method="dialog" class="setup-actions">
        <button id="resign-cancel" type="submit" value="cancel" autofocus>Cancel</button>
        <button id="resign-confirm" type="submit" value="confirm">Confirm resignation</button>
      </form>
    </dialog>
    <dialog id="profile-dialog" aria-labelledby="profile-title">
      <form id="profile-form">
        <h2 id="profile-title">Profile</h2>
        <div class="setup-fields">
          <label id="profile-name-field"><span id="profile-name-label">Display name</span>
            <input id="profile-name" type="text" autocomplete="nickname">
          </label>
          <label id="profile-language-field"><span id="profile-language-label">Language</span>
            <select id="profile-language">
              <option value="en" lang="en">English</option>
              <option value="ro" lang="ro">Română</option>
            </select>
          </label>
        </div>
        <div class="setup-actions">
          <button id="profile-reset" type="button" hidden>Reset</button>
          <button id="save-profile" type="submit">Save</button>
          <button id="cancel-profile" type="button">Cancel</button>
        </div>
        <p id="profile-error" role="alert" hidden></p>
      </form>
    </dialog>
    <dialog id="continue-dialog" aria-labelledby="continue-title">
      <form method="dialog">
        <h2 id="continue-title">Continue from here</h2>
        <p id="continue-description"></p>
        <label id="automatic-option"><input id="continue-automatic" type="checkbox" checked> <span id="automatic-label">Keep AI replies enabled</span></label>
        <div class="setup-actions">
          <button id="cancel-continue" type="submit" value="cancel" autofocus>Cancel</button>
          <button id="confirm-continue" type="submit" value="continue">Continue</button>
        </div>
      </form>
    </dialog>
    <div id="review" class="review" hidden>
      <section class="board-pane" aria-labelledby="position">
        <div class="review-board-frame">
          <div id="board" role="img" class="board" tabindex="0" aria-describedby="board-position"></div>
          <canvas id="review-cue" aria-hidden="true" hidden></canvas>
        </div>
        <p id="board-position" class="visually-hidden"></p>
        <div class="review-controls">
          <div id="review-branches" class="branches" hidden>
            <button id="played" type="button" aria-pressed="false">Played line</button>
            <button id="recommended" type="button" aria-pressed="false">Recommended line</button>
          </div>
          <p id="position"></p>
          <nav class="review-toolbar" aria-label="Review navigation" id="movement">
            <button id="previous" class="review-icon" type="button" aria-label="Previous move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
            <button id="best-line" class="review-icon" type="button" aria-label="Recommended line" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17c0-2-4-4-4-8a7 7 0 0 1 14 0c0 4-4 6-4 8zm1 4h4"/></svg></button>
            <button id="next" class="review-icon" type="button" aria-label="Next move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
            <button id="next-key" class="review-icon" type="button" aria-label="Next key moment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 7 7-7 7m12-14v14"/></svg></button>
            <button id="why" type="button" aria-controls="explanation" aria-describedby="review-selection-context" aria-expanded="false">Why?</button>
            <button id="review-actions" class="review-icon" type="button" aria-label="Review actions" aria-expanded="false" aria-controls="review-menu" hidden><svg class="dots" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
          </nav>
          <div id="review-menu" class="review-menu" hidden>
            <button id="review-on-board" type="button">Show on board</button>
            <button id="continue-review" type="button" hidden>Continue from here</button>
          </div>
        </div>
        <p id="turn" class="visually-hidden"></p>
        <p id="review-selection-context" hidden></p>
        <p id="review-why-context" hidden></p>
      </section>
      <div id="review-details" class="review-details">
        <section id="review-summary" class="review-summary" aria-labelledby="review-graph-label">
          <p id="review-opening" hidden></p>
          <p id="review-graph-label">Evaluation by move · White above the center</p>
          <div id="review-graph-plot" class="review-graph-plot">
            <canvas id="review-graph" aria-hidden="true" hidden></canvas>
            <span id="review-graph-marker" aria-hidden="true" hidden></span>
            <label for="seek" id="seek-label" class="visually-hidden">Select a move by position</label>
            <input id="seek" type="range" min="0" step="1">
          </div>
          <p id="review-score"></p>
          <p id="review-line" hidden></p>
        </section>
        <section id="explanation" class="review-summary" aria-labelledby="why-title" hidden>
          <h2 id="why-title" tabindex="-1">Why?</h2>
          <p id="reason" hidden></p>
          <p id="evaluation" hidden></p>
        </section>
        <section id="review-players" class="review-summary" hidden>
          <div id="review-ratings"></div>
          <p id="review-rating-note"></p>
          <table id="review-comparison"></table>
        </section>
        <section class="review-history" aria-labelledby="history-label">
          <h2 id="history-label" class="visually-hidden">Move history</h2>
          <ol class="history" id="history"></ol>
        </section>
      </div>
      <p id="review-announcement" class="visually-hidden" role="status" aria-atomic="true"></p>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
